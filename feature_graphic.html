<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 1024px; height: 500px;
    overflow: hidden;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .graphic {
    width: 1024px; height: 500px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 80% at 85% 30%, rgba(21,101,192,0.55) 0%, transparent 60%),
      radial-gradient(ellipse 50% 60% at 10% 90%, rgba(13,71,161,0.45) 0%, transparent 55%),
      linear-gradient(135deg, #04102e 0%, #071840 55%, #040e28 100%);
  }
  .dots {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1.5px, transparent 1.5px);
    background-size: 26px 26px;
  }
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; height: 8px;
    background: linear-gradient(90deg, #1565c0 0%, #42a5f5 50%, #0d47a1 100%);
  }

  /* Left content */
  .content {
    position: absolute; left: 70px; top: 0; bottom: 0;
    display: flex; flex-direction: column; justify-content: center;
    z-index: 3; max-width: 560px;
  }
  .brand {
    display: flex; align-items: center; gap: 18px; margin-bottom: 22px;
  }
  .logo-img {
    width: 76px; height: 76px; border-radius: 18px;
    box-shadow: 0 6px 24px rgba(21,101,192,0.6);
  }
  .brand-name {
    font-size: 56px; font-weight: 900; color: #fff; letter-spacing: 6px;
    line-height: 1;
  }
  .brand-name .accent { color: #42a5f5; }

  .tagline {
    font-size: 19px; font-weight: 700; color: #42a5f5;
    letter-spacing: 5px; text-transform: uppercase; margin-bottom: 18px;
    display: flex; align-items: center; gap: 14px;
  }
  .tagline::before, .tagline::after {
    content: ''; display: inline-block; width: 36px; height: 2px;
    background: rgba(66,165,245,0.5); border-radius: 2px;
  }

  .subtitle {
    font-size: 22px; font-weight: 400; color: rgba(255,255,255,0.65);
    line-height: 1.5;
  }
  .subtitle b { color: #fff; font-weight: 700; }

  .badges {
    display: flex; gap: 14px; margin-top: 30px;
  }
  .badge {
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(66,165,245,0.25);
    border-radius: 30px; padding: 10px 20px;
    font-size: 15px; font-weight: 700; color: #fff;
    white-space: nowrap;
  }
  .badge .icon { font-size: 18px; }

  /* Right illustration */
  .illustration {
    position: absolute; right: 0; top: 0; bottom: 0; width: 460px;
    z-index: 2;
  }
</style>
</head>
<body>
<div class="graphic">
  <div class="dots"></div>
  <div class="top-bar"></div>

  <div class="content">
    <div class="brand">
      <img class="logo-img" src="assets/icon/logo.png" alt="UGO"/>
      <div class="brand-name">UGO <span class="accent">DRIVER</span></div>
    </div>
    <div class="tagline">Drive. Deliver. Earn.</div>
    <div class="subtitle">
      <b>Accept rides, navigate routes</b> and get paid fast —<br/>
      everything a driver needs, in one app.
    </div>
    <div class="badges">
      <div class="badge"><span class="icon">🗺️</span> Navigation</div>
      <div class="badge"><span class="icon">💰</span> Fast Payouts</div>
      <div class="badge"><span class="icon">📷</span> QR &amp; NFC</div>
    </div>
  </div>

  <svg class="illustration" viewBox="0 0 460 500" xmlns="http://www.w3.org/2000/svg">
    <!-- big translucent circle -->
    <circle cx="380" cy="120" r="180" fill="rgba(66,165,245,0.07)"/>
    <circle cx="380" cy="120" r="120" fill="rgba(66,165,245,0.06)"/>

    <!-- route path -->
    <path d="M 70 430 C 140 380, 120 280, 220 250 C 320 220, 300 120, 400 90"
          fill="none" stroke="rgba(66,165,245,0.5)" stroke-width="4" stroke-dasharray="2 14" stroke-linecap="round"/>

    <!-- start marker (pickup) -->
    <circle cx="70" cy="430" r="14" fill="#1565c0" stroke="#fff" stroke-width="3"/>
    <text x="70" y="436" font-size="14" fill="#fff" text-anchor="middle" font-weight="700">P</text>

    <!-- waypoint -->
    <circle cx="220" cy="250" r="10" fill="#0d47a1" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>

    <!-- end marker (pin) -->
    <g transform="translate(400,90)">
      <path d="M0,-34 C18,-34 30,-20 30,-4 C30,16 0,40 0,40 C0,40 -30,16 -30,-4 C-30,-20 -18,-34 0,-34 Z"
            fill="#26c281" stroke="#fff" stroke-width="3"/>
      <circle cx="0" cy="-4" r="9" fill="#fff"/>
    </g>

    <!-- small dashed circle accents -->
    <circle cx="220" cy="250" r="26" fill="none" stroke="rgba(66,165,245,0.35)" stroke-width="2" stroke-dasharray="4 6"/>
    <circle cx="400" cy="90" r="50" fill="none" stroke="rgba(38,194,129,0.25)" stroke-width="2" stroke-dasharray="4 6"/>

    <!-- driver / bike icon -->
    <g transform="translate(150,360)">
      <rect x="-46" y="-24" width="92" height="40" rx="8" fill="#1565c0" stroke="#42a5f5" stroke-width="2"/>
      <rect x="8" y="-24" width="38" height="40" rx="8" fill="#0d47a1"/>
      <circle cx="-26" cy="18" r="9" fill="#0a0e1a" stroke="#fff" stroke-width="2"/>
      <circle cx="22" cy="18" r="9" fill="#0a0e1a" stroke="#fff" stroke-width="2"/>
      <rect x="18" y="-16" width="20" height="14" rx="2" fill="rgba(255,255,255,0.7)"/>
    </g>
  </svg>
</div>
</body>
</html>
